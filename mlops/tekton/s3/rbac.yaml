apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-object-creator
  labels:
    app.kubernetes.io/part-of: create-kubernetes-object
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-object-creator
  labels:
    app.kubernetes.io/part-of: create-kubernetes-object
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["kubeflow.org"]
    resources: ["notebooks"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-object-creator
  labels:
    app.kubernetes.io/part-of: create-kubernetes-object
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-object-creator
subjects:
  - kind: ServiceAccount
    name: pipeline-object-creator
---
# Used by the PostSync Job that starts a PipelineRun after Argo CD syncs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-run-creator
  labels:
    app.kubernetes.io/part-of: create-kubernetes-object
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-run-creator
  labels:
    app.kubernetes.io/part-of: create-kubernetes-object
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-run-creator
  labels:
    app.kubernetes.io/part-of: create-kubernetes-object
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-run-creator
subjects:
  - kind: ServiceAccount
    name: pipeline-run-creator
