apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ocp-setup
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: https://github.com/acidonper/rhoai-mlops-demo.git
      targetRevision: master
      path: mlops/argocd/ocp/setup-project
  destination:
    server: https://kubernetes.default.svc
    namespace: "project01"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
