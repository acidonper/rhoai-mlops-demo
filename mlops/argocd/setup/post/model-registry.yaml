---
apiVersion: modelregistry.opendatahub.io/v1beta1
kind: ModelRegistry
metadata:
  annotations:
    openshift.io/description: 'project01 Model Registry'
    openshift.io/display-name: project01-registry
  name: project01-registry
  namespace: rhoai-model-registries
  finalizers:
    - modelregisary.opendatahub.io/finalizer
spec:
  grpc:
    port: 9090
  mysql:
    database: metadb
    host: registry-db.project01.svc.cluster.local
    passwordSecret:
      key: database-password
      name: registry-db
    port: 3306
    username: root
  oauthProxy:
    port: 8443
    routePort: 443
    serviceRoute: enabled
  rest:
    port: 8080
    resources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 256Mi
    serviceRoute: disabled