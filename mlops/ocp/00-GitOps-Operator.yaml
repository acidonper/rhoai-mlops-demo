apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-gitops-operator
  namespace: openshift-gitops-operator
spec:
  upgradeStrategy: Default

---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: openshift-gitops-operator
spec:
  channel: latest
  installPlanApproval: Automatic
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  config:
    env:
      # Optional: Disable the default instance if you only want user-defined instances
      - name: DISABLE_DEFAULT_ARGOCD_INSTANCE
        value: "false"
      # Namespaces whose Argo CD instances may manage cluster-scoped resources.
      # openshift-gitops hosts the default instance, which syncs the cluster-scoped MLflow object.
      - name: ARGOCD_CLUSTER_CONFIG_NAMESPACES
        value: "openshift-gitops,project01,rhoai-model-registries"