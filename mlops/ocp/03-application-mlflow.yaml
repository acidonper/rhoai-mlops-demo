apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ocp-setup-mlflow
  namespace: openshift-gitops
spec:
  project: default
  sources:
    - repoURL: https://github.com/acidonper/rhoai-mlops-demo.git
      targetRevision: master
      path: mlops/helm/setup-mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: "redhat-ods-applications"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
