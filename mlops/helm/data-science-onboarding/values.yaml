# Namespace resources are created in .Release.Namespace, which Argo CD sets
# from the Application destination namespace.
namespace:
  create: false
  labels:
    opendatahub.io/dashboard: "true"

# Endpoint published by NooBaa for storageClassName. The ObjectBucketClaim
# ConfigMap repeats these as BUCKET_HOST and BUCKET_PORT. Credentials stay in
# the Secret of the same name as the claim.
objectStorage:
  host: s3.openshift-storage.svc
  port: "443"
  storageClassName: openshift-storage.noobaa.io
  region: ""

pipeline:
  application: rhoai-odf-connection
  name: create-kubernetes-object
  serviceAccountName: pipeline-object-creator
  runCreatorServiceAccount: pipeline-run-creator
  image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 600

# Each entry creates an ObjectBucketClaim and a Job that starts the pipeline.
# connectionName empty uses aws-connection-<name> inside the pipeline task.
# final name of the bucket is the name of the namespace + the name of the bucket
buckets:
  - name: models # real name is {{ $.Release.Namespace }}-models
    connectionName: aws-connection-models
    workbenchName:
      - test-workbench
      - test-workbench-1
    region: ""
  - name: pipelines # real name is {{ $.Release.Namespace }}-pipelines
    connectionName: aws-connection-pipelines
    workbenchName: []
    region: ""
