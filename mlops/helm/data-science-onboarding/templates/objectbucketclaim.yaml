{{- include "project01.validate" . -}}
{{- range $index, $bucket := .Values.buckets }}
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ $.Release.Namespace }}-{{ $bucket.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "project01.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $bucket.name }}
spec:
  bucketName: {{ $.Release.Namespace }}-{{ $bucket.name }}
  storageClassName: {{ $.Values.objectStorage.storageClassName }}
{{- end }}
