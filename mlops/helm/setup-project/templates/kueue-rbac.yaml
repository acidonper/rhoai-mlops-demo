# The project Argo CD controller inherits admin. Kueue aggregates LocalQueue
# view into admin and keeps create, update, and delete on
# kueue-localqueue-editor-role. OpenShift GitOps applies this binding: the
# project controller cannot grant that permission to itself.
# The subject is the controller ServiceAccount for the ArgoCD named argocd.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-kueue-localqueue-editor
  namespace: {{ $.Values.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: argocd-argocd-application-controller
    namespace: {{ $.Values.namespace.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kueue-localqueue-editor-role
