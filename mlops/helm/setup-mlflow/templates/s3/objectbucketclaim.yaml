{{- include "setup-mlflow.validate" . }}
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ .Values.mlflow.artifactStore.bucket }}
  namespace: {{ .Values.mlflow.namespace }}
spec:
  bucketName: {{ .Values.mlflow.artifactStore.bucket }}
  storageClassName: {{ .Values.objectStorage.storageClassName }}
