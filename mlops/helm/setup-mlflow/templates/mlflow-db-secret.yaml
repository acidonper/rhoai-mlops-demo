{{- include "setup-mlflow.validate" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mlflow.backendStore.secretName }}
  namespace: {{ .Values.mlflow.namespace }}
type: Opaque
stringData:
  username: {{ .Values.postgresql.user | quote }}
  password: {{ .Values.postgresql.password | quote }}
  database: {{ .Values.postgresql.database | quote }}
  host: {{ include "setup-mlflow.postgresHost" . | quote }}
  port: "5432"
  backend-store-uri: {{ include "setup-mlflow.postgresUri" . | quote }}
  registry-store-uri: {{ include "setup-mlflow.postgresUri" . | quote }}
