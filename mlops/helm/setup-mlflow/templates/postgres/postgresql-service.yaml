{{- include "setup-mlflow.validate" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgresql.name }}
  namespace: {{ .Values.mlflow.namespace }}
  labels:
    app: {{ .Values.postgresql.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.postgresql.name }}
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: 5432
