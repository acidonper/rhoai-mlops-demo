{{- include "setup-mlflow.validate" . }}
---
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: {{ .Values.mlflow.name }}
spec:
  replicas: {{ .Values.mlflow.replicas | int }}
  backendStoreUriFrom:
    name: {{ .Values.mlflow.backendStore.secretName }}
    key: backend-store-uri
  registryStoreUriFrom:
    name: {{ .Values.mlflow.backendStore.secretName }}
    key: registry-store-uri
  defaultArtifactRoot: {{ printf "s3://%s" .Values.mlflow.artifactStore.bucket | quote }}
  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: {{ .Values.mlflow.artifactStore.secretName }}
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: {{ .Values.mlflow.artifactStore.secretName }}
          key: AWS_SECRET_ACCESS_KEY
    - name: MLFLOW_S3_ENDPOINT_URL
      value: {{ printf "https://%s:%s" .Values.objectStorage.host .Values.objectStorage.port | quote }}
