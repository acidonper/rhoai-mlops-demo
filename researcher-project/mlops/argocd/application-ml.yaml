apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-ml
  namespace: project01
spec:
  project: default
  sources:
    - repoURL: https://github.com/acidonper/rhoai-mlops-demo.git
      targetRevision: master
      path: researcher-project/mlops/ml
  destination:
    server: https://kubernetes.default.svc
    namespace: "project01"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
