---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ct-pipeline
spec:
  workspaces:
    - name: shared-workspace
    - name: model-workspace
  params:
    - name: APPLICATION_NAME
      type: string
      default: ""
    - name: PROJECT_NAME
      type: string
      default: ""
    - name: GIT_URL
      type: string
      default: ""
    - name: GIT_SHORT_REVISION
      type: string
      default: ""
    - name: GIT_BRANCH
      type: string
      default: ""
    - name: GIT_COMMIT_AUTHOR
      type: string
      default: ""
    - default: "false"
      name: GIT_SSL_VERIFY
      type: string
  tasks:
    # Clone jukebox repository
    - name: fetch-ds-pipeline-repository
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines 
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: URL
          value: "$(params.GIT_URL)"
        - name: REVISION
          value: "master"
        - name: SUBDIRECTORY
          value: "$(params.APPLICATION_NAME)/$(params.GIT_BRANCH)"
        - name: DELETE_EXISTING
          value: "true"
        - name: SSL_VERIFY
          value: "$(params.GIT_SSL_VERIFY)"

    # Execute Data Science Pipeline
    - name: execute-ds-pipeline
      taskRef:
        name: execute-ds-pipeline
        kind: Task
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: WORK_DIRECTORY
          value: "$(params.APPLICATION_NAME)/$(params.GIT_BRANCH)/researcher-project/pipelines"
        - name: APPLICATION_NAME
          value: "$(params.APPLICATION_NAME)"
        - name: GIT_SHORT_REVISION
          value: "$(params.GIT_SHORT_REVISION)"
      runAfter:
        - fetch-ds-pipeline-repository

    # Containerize the model (modelcar)
    - name: build-modelcar
      taskRef:
        name: build-modelcar
        kind: Task
      workspaces:
        - name: output
          workspace: model-workspace
      params:
        - name: APPLICATION_NAME
          value: "$(params.APPLICATION_NAME)"
        - name: VERSION
          value: "$(params.GIT_SHORT_REVISION)"
        - name: PROJECT_NAME
          value: {{ .Values.namespace }}
      runAfter:
        - execute-ds-pipeline

    # Update model version in Git (**MANUALLY**)
    # - name: deploy-test
    #   taskRef:
    #     name: deploy-or-raise-pr
    #     kind: Task
    #   runAfter:
    #     - build-modelcar
    #   workspaces:
    #     - name: output
    #       workspace: shared-workspace
    #   params:
    #     - name: APPLICATION_NAME
    #       value: "$(params.APPLICATION_NAME)"
    #     - name: VERSION
    #       value: "$(params.GIT_SHORT_REVISION)"
    #     - name: WORK_DIRECTORY
    #       value: "$(params.APPLICATION_NAME)/$(params.GIT_BRANCH)/researcher-project/mlops/ml"
    #     - name: PROJECT_NAME
    #       value: {{ .Values.namespace }}
          
    # update model metadata
    - name: update-model-metadata
      taskRef:
        name: update-model-metadata
        kind: Task
      runAfter:
        - build-modelcar
      params:
        - name: APPLICATION_NAME
          value: "$(params.APPLICATION_NAME)"
        - name: VERSION
          value: "$(params.GIT_SHORT_REVISION)"
        - name: PROJECT_NAME
          value: {{ .Values.namespace }}
        - name: KFP_RUN_ID
          value: "$(tasks.execute-ds-pipeline.results.KFP_RUN_ID)"
        - name: GIT_COMMIT_AUTHOR
          value: "$(params.GIT_COMMIT_AUTHOR)"
          
  results:
    - name: KFP_RUN_ID
      description: Run ID of the Data Science Pipeline
      value: "$(tasks.execute-ds-pipeline.results.KFP_RUN_ID)"