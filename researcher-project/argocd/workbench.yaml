apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  annotations:
    opendatahub.io/image-display-name: Jupyter | Data Science | CPU | Python 3.12
    opendatahub.io/hardware-profile-resource-version: '35026'
    opendatahub.io/user: admin
    openshift.io/description: ''
    openshift.io/display-name: test-workbench
    notebooks.opendatahub.io/last-image-version-git-commit-selection: a2a3d89
    notebooks.opendatahub.io/last-image-selection: 's2i-generic-data-science-notebook:2025.2'
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/username: admin
    opendatahub.io/hardware-profile-name: default-profile
    opendatahub.io/connections: project01/aws-connection-models
    notebooks.opendatahub.io/inject-auth: 'true'
    opendatahub.io/workbench-image-namespace: ''
  name: test-workbench
  namespace: project01
  labels:
    app: test-workbench
    opendatahub.io/dashboard: 'true'
    opendatahub.io/odh-managed: 'true'
spec:
  template:
    spec:
      containers:
        - resources:
            limits:
              cpu: '4'
              memory: 8Gi
            requests:
              cpu: '4'
              memory: 6Gi
          name: test-workbench
          envFrom:
            - secretRef:
                name: aws-connection-models
          image: 'image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:2025.2'
          workingDir: /opt/app-root/src
